---
- name: Deploy the Cloud-1 WordPress stack
  hosts: wordpress_servers
  become: true
  gather_facts: true

  vars_files:
    - group_vars/generated.yml
    - group_vars/vault.yml

  roles:
    - role: common
    - role: docker
    - role: cloud1_layout
    - role: secrets
    - role: mysql
    - role: wordpress
    - role: phpmyadmin
    - role: duckdns
      when: enable_duckdns | bool
    - role: nginx
    - role: compose
    - role: certbot
      when: enable_tls | bool
    - role: summary
